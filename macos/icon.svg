<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3b73"/>
      <stop offset="1" stop-color="#0a1530"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#36d6c3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#36d6c3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8ff3e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824x824 body centred on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <g fill="none" stroke="url(#wave)" stroke-linecap="round" stroke-width="58">
    <path d="M 392 520 A 170 170 0 0 1 632 520" opacity="1"/>
    <path d="M 300 428 A 300 300 0 0 1 724 428" opacity="0.8"/>
    <path d="M 208 336 A 430 430 0 0 1 816 336" opacity="0.55"/>
  </g>
  <circle cx="512" cy="640" r="62" fill="#ffffff"/>
  <!-- signal bars -->
  <g fill="#8ff3e6">
    <rect x="626" y="742" width="40" height="70" rx="10" opacity="0.55"/>
    <rect x="684" y="704" width="40" height="108" rx="10" opacity="0.75"/>
    <rect x="742" y="660" width="40" height="152" rx="10"/>
  </g>
</svg>
