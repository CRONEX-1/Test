name: Build Mac app

on:
  push:
    paths:
      - "macos/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build Sigscan.app
        run: macos/build.sh

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest macos/build/Sigscan.zip \
            --target "$GITHUB_SHA" \
            --title "Sigscan for Mac" \
            --notes "Download **Sigscan.zip**, double-click it to unzip, and drag **Sigscan** into your Applications folder.

          The first time you open it, macOS will say it can't verify the app (it isn't signed with a paid Apple developer certificate). Go to **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**.

          Requires macOS 13 Ventura or later. Built from commit ${GITHUB_SHA::7}."
